name: Build Steve 2D Reference

on:
  push:
    paths:
      - ".github/workflows/build-steve-2d.yml"
      - "mod/steve_renderer_pipeline.json"
      - "tools/steve-render-trigger.txt"
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout asset-renderer
        uses: actions/checkout@v4
        with:
          repository: minecraft-library/asset-renderer
          ref: 844f2cae75844ea56494e0b28f294d4797f0cf45
          path: renderer

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Generate vanilla client cache
        working-directory: renderer
        run: |
          chmod +x gradlew
          ./gradlew slowTest --tests "*ClientAcquisitionIntegrationTest" --no-daemon

      - name: Render Steve 2D
        working-directory: renderer
        run: |
          ./gradlew playerRender -PrenderSize=128 -Psheets=core-matrix --no-daemon
          find cache/visual/player-render -type f -maxdepth 3 -print

      - name: Collect 2D player renders
        run: |
          mkdir -p out
          find renderer/cache/visual/player-render -type f \( -name "*.png" -o -name "*.gif" \) -exec cp {} out/ \;
          ls -lh out

      - name: Upload Steve 2D reference
        uses: actions/upload-artifact@v4
        with:
          name: undercraft-steve-2d-reference
          path: out/
          if-no-files-found: error
